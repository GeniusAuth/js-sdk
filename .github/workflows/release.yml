name: Publish npm package

on:
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: write
    id-token: write

concurrency:
    group: npm-release-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org
                  cache: npm
            - run: npm ci
            - run: npm run check
            - name: Verify release version
              if: github.event_name == 'push'
              run: test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"
            - name: Create GitHub release
              if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
            - run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
