name: CodeQL

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '23 3 * * 1'

permissions:
    contents: read
    security-events: write

jobs:
    analyze:
        name: Analyze JavaScript
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: github/codeql-action/init@v4.37.3
              with:
                  languages: javascript-typescript
            - uses: github/codeql-action/analyze@v4.37.3
